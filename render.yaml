services:
  - type: web
    name: marquee
    runtime: node
    plan: free
    buildCommand: npm install && npm install --prefix server && npm install --prefix client && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://marquee.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TMDB_ACCESS_TOKEN
        sync: false
      - key: OMDB_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
